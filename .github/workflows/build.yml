name: Build NetManager APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Generate project files
        run: |
          mkdir -p app/src/main/java/com/example/netmanager

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "NetManager"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.netmanager"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.netmanager"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <application android:label="Net Manager" android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".FirewallService" android:exported="false"
                      android:permission="android.permission.BIND_VPN_SERVICE">
                      <intent-filter><action android:name="android.net.VpnService"/></intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/netmanager/FirewallService.kt <<'EOF'
          package com.example.netmanager

          import android.content.Intent
          import android.net.*
          import android.os.ParcelFileDescriptor
          import java.io.FileInputStream

          class FirewallService : VpnService() {
              private var tun: ParcelFileDescriptor? = null
              private var current: Set<String>? = null
              private var registered = false
              private lateinit var cm: ConnectivityManager
              private val cb = object : ConnectivityManager.NetworkCallback() {
                  override fun onCapabilitiesChanged(n: Network, c: NetworkCapabilities) = applyRules()
                  override fun onLost(n: Network) = applyRules()
              }

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  if (i?.action == "STOP") { shutdown(); stopSelf(); return START_NOT_STICKY }
                  cm = getSystemService(ConnectivityManager::class.java)
                  if (!registered) {
                      cm.registerNetworkCallback(NetworkRequest.Builder().build(), cb)
                      registered = true
                  }
                  applyRules()
                  return START_STICKY
              }

              @Synchronized private fun applyRules() {
                  val caps = cm.allNetworks.mapNotNull { cm.getNetworkCapabilities(it) }
                      .firstOrNull {
                          !it.hasTransport(NetworkCapabilities.TRANSPORT_VPN) &&
                              it.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                      }
                  val prefs = getSharedPreferences("rules", MODE_PRIVATE)
                  val key = when {
                      caps?.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) == true -> "blockWifi"
                      caps?.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR) == true -> "blockMobile"
                      else -> null
                  }
                  val blocked = if (key == null) emptySet() else prefs.getStringSet(key, emptySet())!!.toSet()
                  if (blocked == current) return
                  current = blocked
                  tun?.close(); tun = null
                  if (blocked.isEmpty()) return
                  val b = Builder().setSession("NetManager").addAddress("10.0.0.2", 32).addRoute("0.0.0.0", 0)
                  blocked.forEach { try { b.addAllowedApplication(it) } catch (_: Exception) {} }
                  val fd = b.establish() ?: return
                  tun = fd
                  Thread {
                      val ins = FileInputStream(fd.fileDescriptor)
                      val buf = ByteArray(32767)
                      try { while (ins.read(buf) >= 0) { } } catch (_: Exception) {}
                  }.start()
              }

              private fun shutdown() {
                  if (registered) {
                      try { cm.unregisterNetworkCallback(cb) } catch (_: Exception) {}
                      registered = false
                  }
                  tun?.close(); tun = null; current = null
              }

              override fun onDestroy() { shutdown(); super.onDestroy() }
          }
          EOF

          cat > app/src/main/java/com/example/netmanager/Scanner.kt <<'EOF'
          package com.example.netmanager

          import android.content.Context
          import android.net.*
          import java.net.*
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit

          object Scanner {
              private val common = intArrayOf(21, 22, 23, 53, 80, 111, 139, 443, 445, 554, 631, 1883, 3389, 5900, 8000, 8080, 8443, 9100)

              private fun open(ip: String, port: Int, ms: Int = 250): Boolean = try {
                  Socket().use { it.connect(InetSocketAddress(ip, port), ms); true }
              } catch (_: Exception) { false }

              fun portScan(host: String, from: Int, to: Int, log: (String) -> Unit) {
                  log("Port scan $host $from-$to")
                  val ex = Executors.newFixedThreadPool(100)
                  for (p in from..to) ex.execute { if (open(host, p, 300)) log("  $host:$p open") }
                  ex.shutdown(); ex.awaitTermination(5, TimeUnit.MINUTES); log("Done.")
              }

              fun subnet(ctx: Context, log: (String) -> Unit) {
                  val cm = ctx.getSystemService(ConnectivityManager::class.java)
                  val la = cm.allNetworks.firstOrNull {
                      cm.getNetworkCapabilities(it)?.hasTransport(NetworkCapabilities.TRANSPORT_WIFI) == true
                  }?.let { cm.getLinkProperties(it) }?.linkAddresses?.firstOrNull { it.address is Inet4Address }
                  if (la == null) { log("Not connected to Wi-Fi."); return }
                  val prefix = maxOf(la.prefixLength, 22)
                  val ip = la.address.address.fold(0L) { a, b -> (a shl 8) or (b.toLong() and 0xff) }
                  val mask = (0xFFFFFFFFL shl (32 - prefix)) and 0xFFFFFFFFL
                  val net = ip and mask
                  val broadcast = net or (mask.inv() and 0xFFFFFFFFL)
                  fun str(v: Long) = "${v shr 24 and 255}.${v shr 16 and 255}.${v shr 8 and 255}.${v and 255}"
                  log("Scanning ${str(net)}/$prefix ...")
                  val ex = Executors.newFixedThreadPool(64)
                  for (h in (net + 1) until broadcast) {
                      val addr = str(h)
                      ex.execute {
                          val ports = common.filter { open(addr, it, 200) }
                          val alive = ports.isNotEmpty() ||
                              try { InetAddress.getByName(addr).isReachable(300) } catch (_: Exception) { false }
                          if (alive) log("* $addr  ports: ${if (ports.isEmpty()) "none found" else ports.joinToString(",")}")
                      }
                  }
                  ex.shutdown(); ex.awaitTermination(5, TimeUnit.MINUTES); log("Subnet scan finished.")
              }
          }
          EOF

          cat > app/src/main/java/com/example/netmanager/MainActivity.kt <<'EOF'
          package com.example.netmanager

          import android.app.Activity
          import android.content.Intent
          import android.net.VpnService
          import android.os.Bundle
          import android.view.ViewGroup.LayoutParams.*
          import android.widget.*

          class MainActivity : Activity() {
              private val prefs by lazy { getSharedPreferences("rules", MODE_PRIVATE) }
              private lateinit var out: TextView

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(24, 24, 24, 24) }
                  fun bar() = LinearLayout(this).also { root.addView(it) }
                  fun Button.into(l: LinearLayout, f: () -> Unit) = apply {
                      setOnClickListener { f() }
                      l.addView(this, LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                  }
                  val b1 = bar()
                  Button(this).apply { text = "Firewall ON" }.into(b1) { startFirewall() }
                  Button(this).apply { text = "Firewall OFF" }.into(b1) {
                      startService(Intent(this, FirewallService::class.java).setAction("STOP"))
                  }
                  val host = EditText(this).apply { hint = "Host to port-scan, e.g. 192.168.1.1" }
                  root.addView(host)
                  val b2 = bar()
                  Button(this).apply { text = "Subnet scan" }.into(b2) { bg { Scanner.subnet(this, ::log) } }
                  Button(this).apply { text = "Port scan 1-1024" }.into(b2) {
                      val h = host.text.toString().trim()
                      if (h.isNotEmpty()) bg { Scanner.portScan(h, 1, 1024, ::log) }
                  }

                  out = TextView(this).apply { text = "Scan output appears here\n"; textSize = 12f; setTextIsSelectable(true) }
                  root.addView(ScrollView(this).apply { addView(out) }, LinearLayout.LayoutParams(MATCH_PARENT, 350))

                  root.addView(TextView(this).apply { text = "Tick = BLOCK internet on that network"; setPadding(0, 16, 0, 8) })
                  val list = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val pm = packageManager
                  pm.getInstalledApplications(0)
                      .filter { pm.getLaunchIntentForPackage(it.packageName) != null && it.packageName != packageName }
                      .sortedBy { pm.getApplicationLabel(it).toString().lowercase() }
                      .forEach { app ->
                          val row = LinearLayout(this).apply { gravity = android.view.Gravity.CENTER_VERTICAL }
                          row.addView(TextView(this).apply { text = pm.getApplicationLabel(app) },
                              LinearLayout.LayoutParams(0, WRAP_CONTENT, 1f))
                          row.addView(box("Wi-Fi", "blockWifi", app.packageName))
                          row.addView(box("Data", "blockMobile", app.packageName))
                          list.addView(row)
                      }
                  root.addView(ScrollView(this).apply { addView(list) }, LinearLayout.LayoutParams(MATCH_PARENT, 0, 1f))
                  setContentView(root)
              }

              private fun box(label: String, key: String, pkg: String) = CheckBox(this).apply {
                  text = label
                  isChecked = prefs.getStringSet(key, emptySet())!!.contains(pkg)
                  setOnCheckedChangeListener { _, on ->
                      val s = prefs.getStringSet(key, emptySet())!!.toMutableSet()
                      if (on) s.add(pkg) else s.remove(pkg)
                      prefs.edit().putStringSet(key, s).apply()
                      if (VpnService.prepare(this@MainActivity) == null)
                          startService(Intent(this@MainActivity, FirewallService::class.java))
                  }
              }

              private fun startFirewall() {
                  val i = VpnService.prepare(this)
                  if (i != null) startActivityForResult(i, 1)
                  else startService(Intent(this, FirewallService::class.java))
              }

              override fun onActivityResult(r: Int, c: Int, d: Intent?) {
                  if (r == 1 && c == RESULT_OK) startService(Intent(this, FirewallService::class.java))
              }

              private fun bg(f: () -> Unit) = Thread(f).start()
              private fun log(s: String) = runOnUiThread { out.append(s + "\n") }
          }
          EOF

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NetManager-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Release APK on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
